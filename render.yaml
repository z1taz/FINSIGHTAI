services:
  # 1. FastAPI Python Backend Service
  - type: web
    name: finsight-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finsight-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # 2. React Vite Frontend Static Site
  - type: web
    name: finsight-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://finsight-backend.onrender.com/api

databases:
  # 3. Managed Render PostgreSQL Database
  - name: finsight-postgres
    databaseName: finsight
    user: finsight_user
    plan: free
